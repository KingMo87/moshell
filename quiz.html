<style>
  /* MOSHELL Linux Trivia — charcoal lab (same system as index.html) */
  :root{
    --bg:#101218;
    --bg3:#0b0d11;
    --surface:#1a1e26;
    --surface2:#222733;
    --border:#2c3340;
    --border2:#3c4554;
    --text:#f2eee6;
    --text2:#b8c0cc;
    --text3:#7d8694;
    --signal:#e2b657;
    --signal-2:#efc97a;
    --signal-bg:#2a2210;
    --on-signal:#0b0d11;
    --ok:#8fcf6e;
    --ok-bg:#1c2814;
    --bad:#ff8f70;
    --bad-bg:#2c1612;
    --display:'Source Serif 4',Georgia,'Times New Roman',serif;
    --sans:'Source Sans 3','Segoe UI',Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    /* legacy names */
    --mint:var(--signal); --ink:var(--text); --muted:var(--text2); --muted-2:var(--text3);
    --panel-solid:var(--surface);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:17px;line-height:1.55;
    overflow-x:hidden;
  }
  :focus-visible{outline:3px solid var(--signal);outline-offset:3px}
  button{font-family:var(--sans)}

  /* site bar */
  .sitebar{border-bottom:1px solid var(--border);background:var(--bg)}
  .sitebar-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;
    padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
  .site-logo{display:flex;align-items:baseline;gap:12px;color:var(--text);text-decoration:none}
  .site-logo b{font-family:var(--display);font-weight:650;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
  .site-logo small{font-family:var(--mono);font-size:.72rem;color:var(--text3);letter-spacing:.05em}
  .site-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .site-link{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;font-size:.95rem;color:var(--text2);text-decoration:none}
  .site-link:hover{color:var(--text)}
  .site-link.pro{background:var(--signal);color:var(--on-signal)}
  .site-link.pro:hover{background:var(--signal-2);color:var(--on-signal)}

  .stage{width:100%;max-width:780px;margin:0 auto;
    padding:clamp(20px,5vh,48px) max(16px, env(safe-area-inset-right,0px)) 48px max(16px, env(safe-area-inset-left,0px))}
  .glow{display:none}
  .card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.28)}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-bottom:2px solid var(--border2);background:var(--bg3)}
  .topbar .id{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.85rem;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
  .topbar .id b{background:var(--signal);color:var(--on-signal);padding:2px 8px;font-weight:700}
  .pulse{display:none}
  .topbar .ver{font-family:var(--mono);font-size:.78rem;color:var(--text3)}

  .body{padding:28px 26px 26px}

  /* name gate */
  .namewrap h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;text-transform:uppercase;margin:0 0 10px}
  .namewrap p{margin:0 0 18px;color:var(--text2);font-size:1.05rem;max-width:46ch}
  .nameinput{width:100%;min-height:52px;background:var(--bg3);border:2px solid var(--border2);color:var(--text);
    font-family:var(--mono);font-size:1.05rem;padding:0 14px;outline:none}
  .nameinput:focus{border-color:var(--signal)}
  .nameinput::placeholder{color:var(--text3)}
  .namebtn{margin-top:12px;width:100%;min-height:56px;background:var(--signal);border:none;color:var(--on-signal);
    font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .namebtn:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed}
  .namebtn:not(:disabled):hover{background:var(--signal-2)}
  .namecancel{margin-top:10px;width:100%;min-height:48px;background:transparent;border:2px solid var(--border2);color:var(--text2);font-size:1rem;cursor:pointer}
  .namecancel:hover{border-color:var(--text2);color:var(--text)}

  /* operator bar */
  .operatorbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .operatorbar .who{display:flex;align-items:center;gap:12px;min-width:0}
  .avatar{width:44px;height:44px;flex:none;background:var(--signal);color:var(--on-signal);display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.04em}
  .operatorbar .name{font-weight:700;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
  .operatorbar .rank{font-family:var(--mono);font-size:.82rem;color:var(--text2);margin-top:2px}
  .operatorbar .linkbtn{min-height:42px;background:transparent;border:2px solid var(--border2);color:var(--text2);
    font-weight:600;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;padding:0 12px;cursor:pointer}
  .operatorbar .linkbtn:hover{color:var(--text);border-color:var(--text2)}

  /* badges / profile */
  .badgegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
  .badgecell{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .hex{width:64px;height:64px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center}
  .hex .chev{color:var(--on-signal);font-family:var(--mono);font-size:.95rem;font-weight:700;line-height:1;margin-top:-3px}
  .hex.locked{background:var(--bg3)!important;outline:2px dashed var(--border2)}
  .badgecell .bname{font-size:.95rem;font-weight:700;color:var(--text)}
  .badgecell .bname.dim{color:var(--text3);font-weight:500}
  .badgecell .bprog{font-family:var(--mono);font-size:.78rem;color:var(--text3)}
  .statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:4px 0 8px}
  .statbox{background:var(--bg3);border:2px solid var(--border);padding:14px 16px}
  .statbox .sval{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
  .statbox .slbl{font-family:var(--mono);font-size:.78rem;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .sectionlbl{font-family:var(--mono);font-size:.82rem;color:var(--text2);margin:24px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .bestgrid{display:grid;gap:8px;margin-top:10px}
  .bestrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg3);border:2px solid var(--border);padding:12px 14px;font-size:1rem}
  .bestrow .blen{color:var(--text2)}
  .bestrow .bscore{font-family:var(--mono);color:var(--signal);font-weight:700}
  .bestrow .bscore.none{color:var(--text3);font-weight:400}

  /* badge unlock + CTA */
  .unlockpanel{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--signal-bg);border:2px solid var(--signal);padding:14px 16px;margin-bottom:22px}
  .unlockpanel .hex{width:52px;height:52px;flex:none}
  .unlockpanel .utext{flex:1 1 200px;min-width:0}
  .unlockpanel .utext .utitle{font-family:var(--mono);font-size:.8rem;color:var(--signal-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .unlockpanel .utext .uname{font-size:1.05rem;font-weight:700;margin-top:2px}
  .unlockpanel .ucta{flex:none;display:inline-flex;align-items:center;min-height:44px;background:var(--signal);color:var(--on-signal);
    font-weight:700;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;padding:0 14px;text-decoration:none}
  .unlockpanel .ucta:hover{background:var(--signal-2)}
  .ctacard{background:var(--bg3);border:2px solid var(--border2);padding:18px 20px;margin:22px 0}
  .ctacard .ceyebrow{font-family:var(--mono);font-size:.8rem;color:var(--signal-2);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .ctacard .ctitle{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.05;text-transform:uppercase;margin-bottom:6px}
  .ctacard .csub{font-size:1.02rem;color:var(--text2);margin-bottom:14px}
  .ctacard .cbtn{display:inline-flex;align-items:center;min-height:50px;background:var(--signal);color:var(--on-signal);text-decoration:none;
    font-weight:700;font-size:.95rem;letter-spacing:.07em;text-transform:uppercase;padding:0 20px}
  .ctacard .cbtn:hover{background:var(--signal-2)}

  /* start screen */
  .hero h1{font-family:var(--display);font-weight:650;font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.2;margin:0 0 12px}
  .hero h1 .accent{color:var(--signal)}
  .hero p{margin:0;color:var(--text2);font-size:1.08rem;max-width:48ch}
  .lengths{margin-top:24px;display:grid;gap:10px}
  .lenbtn{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px;background:var(--bg3);border:2px solid var(--border2);
    color:var(--text);padding:12px 18px;cursor:pointer;text-align:left}
  .lenbtn:hover{border-color:var(--signal);background:var(--surface2)}
  .lenbtn .lname{font-family:var(--sans);font-weight:600;font-size:1.15rem;line-height:1.2}
  .lenbtn .lsub{display:block;font-size:.98rem;color:var(--text2);margin-top:4px}
  .lenbtn .lcount{flex:none;min-width:58px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;color:var(--on-signal);background:var(--signal);padding:8px 10px}
  .topics{margin-top:26px}
  .topics .lbl{font-family:var(--mono);font-size:.82rem;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--mono);font-size:.82rem;color:var(--text2);padding:4px 10px;border:1.5px solid var(--border2)}

  /* question screen */
  .progresswrap{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .progresstrack{flex:1;height:12px;background:var(--bg3);border:1px solid var(--border2);overflow:hidden}
  .progressfill{height:100%;background:var(--signal);width:0%;transition:width .3s ease}
  .progresstxt{font-family:var(--mono);font-size:.9rem;color:var(--text2);white-space:nowrap}
  .scoretxt{font-family:var(--mono);font-size:.9rem;color:var(--text);white-space:nowrap;font-weight:700}
  .qframe{animation:rise .25s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .catpill{display:inline-flex;font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--on-signal);background:var(--signal);padding:3px 10px;margin-bottom:14px}
  .qtext{font-size:clamp(1.3rem,2.6vw,1.6rem);font-weight:700;line-height:1.35;margin-bottom:20px;color:var(--text)}
  .options{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;min-height:60px;background:var(--bg3);border:2px solid var(--border2);color:var(--text);
    padding:10px 14px;cursor:pointer;font-size:1.08rem;line-height:1.4;text-align:left}
  .opt:hover:not(.locked){border-color:var(--text2);background:var(--surface2)}
  .opt .key{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:1rem;font-weight:700;
    color:var(--text);border:2px solid var(--border2)}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .key{background:var(--ok);border-color:var(--ok);color:var(--on-signal)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--on-signal)}
  .feedback{margin-top:16px;font-size:1.05rem;font-weight:600;min-height:26px}
  .feedback.ok{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .footerbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
  .hint{font-family:var(--mono);font-size:.82rem;color:var(--text3)}
  .nextbtn{min-height:52px;background:var(--signal);border:none;color:var(--on-signal);font-weight:700;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;
    padding:0 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s ease}
  .nextbtn.active{opacity:1;pointer-events:auto}
  .nextbtn:hover{background:var(--signal-2)}

  /* results */
  .resulttop{display:flex;align-items:center;gap:22px;margin-bottom:24px}
  .ring{flex:none;width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--signal) calc(var(--pct) * 1%), var(--bg3) 0);position:relative}
  .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
  .ring .val{position:relative;font-family:var(--display);font-weight:700;font-size:2rem}
  .resulttop .rtext h2{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1;text-transform:uppercase}
  .resulttop .rtext p{margin:0;font-size:1rem;color:var(--text2)}
  .breakdown{display:grid;gap:10px;margin-bottom:22px}
  .brow{display:flex;align-items:center;gap:12px}
  .brow .blabel{width:210px;flex:none;font-size:.98rem;color:var(--text2)}
  .brow .btrack{flex:1;height:12px;background:var(--bg3);border:1px solid var(--border2);overflow:hidden}
  .brow .bfill{display:block;height:100%;background:var(--signal)}
  .brow .bval{width:48px;flex:none;text-align:right;font-family:var(--mono);font-size:.9rem;color:var(--text2)}
  .missed h3{font-family:var(--mono);font-size:.85rem;color:var(--text2);font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em}
  .mitem{border:2px solid var(--border);border-left:4px solid var(--bad);background:var(--bg3);padding:12px 14px;margin-bottom:8px}
  .mitem .mq{font-size:1.02rem;color:var(--text);margin-bottom:6px;font-weight:600}
  .mitem .ma{font-size:.95rem;color:var(--text2)}
  .mitem .ma b{color:var(--ok);font-weight:700}
  .clean{font-size:1.02rem;color:var(--text2)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .abtn{flex:1 1 200px;min-height:56px;cursor:pointer;font-size:1rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    border:2px solid var(--border2);background:transparent;color:var(--text)}
  .abtn:hover{border-color:var(--text2)}
  .abtn.primary{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
  .abtn.primary:hover{background:var(--signal-2)}

  @media (max-width:520px){
    .body{padding:22px 16px}
    .topbar{padding:10px 16px}
    .brow{flex-wrap:wrap;gap:6px 10px}
    .brow .blabel{width:100%}
    .resulttop{gap:16px}
    .ring{width:88px;height:88px}
    .ring .val{font-size:1.6rem}
    .badgegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .statgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .statbox{padding:10px}
    .statbox .sval{font-size:1.9rem}
    .site-logo small{display:none}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.qframe{animation:none}.progressfill{transition:none}}
</style>
</head>

function defaultProfile(nickname){
  return {
    nickname: nickname,
    totalAnswered: 0,
    totalCorrect: 0,
    bestByLength: {},
    badges: [],
    createdAt: Date.now()
  };
}

function loadProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(err){
    console.warn('moshell-quiz: could not read local storage', err);
    return null;
  }
}

function saveProfile(profile){
  try{
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  }catch(err){
    console.warn('moshell-quiz: could not save to local storage', err);
  }
}

function currentRank(profile){
  let rank = null;
  BADGES.forEach(b => { if(profile.totalAnswered >= b.threshold) rank = b; });
  return rank;
}

function nextBadge(profile){
  return BADGES.find(b => profile.totalAnswered < b.threshold) || null;
}

function badgeHex(badge, locked){
  const bg = locked ? 'rgba(255,255,255,.05)' : `linear-gradient(160deg, ${badge.c1}, ${badge.c2})`;
  const chevs = Array.from({length:badge.level}).map(()=>'&#94;').join('');
  return `<div class="hex${locked?' locked':''}" style="background:${bg}">
    <span class="chev">${locked ? '' : chevs}</span>
  </div>`;
}

function escHtml(v){
  return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(name){
  return escHtml((name||'?').trim().slice(0,2).toUpperCase());
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function categoryCounts(){
  const cats = {};
  QUESTIONS.forEach(q => cats[q.cat] = (cats[q.cat]||0)+1);
  return cats;
}

function renderNameGate(){
  // Rename screen. Changing the name keeps all scores and badges.
  const existing = loadProfile();
  body.innerHTML = `
    <div class="namewrap">
      <h1>${existing ? 'Change your name' : 'Pick a name'}</h1>
      <p>Your name shows on your profile and rank badges. It is saved only on this device.</p>
      <label for="nameInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Name</label>
      <input class="nameinput" id="nameInput" maxlength="18" placeholder="Name" autocomplete="off" value="${existing ? escHtml(existing.nickname) : ''}" />
      <button class="namebtn" id="nameBtn"${existing ? '' : ' disabled'}>Save</button>
      ${existing ? '<button class="namecancel" id="nameCancel" type="button">Cancel</button>' : ''}
    </div>
  `;
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('nameBtn');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length === 0; });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !btn.disabled) btn.click(); });
  btn.addEventListener('click', ()=>{
    const nickname = input.value.trim().slice(0,18);
    if(!nickname) return;
    const profile = loadProfile() || defaultProfile(nickname);
    profile.nickname = nickname;
    saveProfile(profile);
    renderStart();
  });
  const cancel = document.getElementById('nameCancel');
  if(cancel) cancel.addEventListener('click', renderStart);
  setTimeout(()=> { input.focus(); input.select(); }, 50);
}

        <div>
          <div class="name">${escHtml(profile.nickname)}</div>
          <div class="rank">${rank ? rank.name : 'Unranked'} &middot; ${profile.totalAnswered} answered</div>
        </div>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="linkbtn" id="profileBtn">Profile</button>
        <button class="linkbtn" id="switchBtn">Change name</button>
      </div>
    </div>
    <div class="hero">
      <h1>Test your <span class="accent">Linux</span> knowledge</h1>
      <p>100 questions from the fundamentals to Docker. Pick a length and start. Answer with a click or keys 1–4.</p>
    </div>
    <div class="lengths">
      <button class="lenbtn" data-len="10"><span><span class="lname">Quick run</span><span class="lsub">A fast warm-up</span></span><span class="lcount">10</span></button>
      <button class="lenbtn" data-len="25"><span><span class="lname">Standard run</span><span class="lsub">A solid check-in</span></span><span class="lcount">25</span></button>
      <button class="lenbtn" data-len="50"><span><span class="lname">Long run</span><span class="lsub">Cover most topics</span></span><span class="lcount">50</span></button>
      <button class="lenbtn" data-len="100"><span><span class="lname">Full deck</span><span class="lsub">Every question, shuffled</span></span><span class="lcount">100</span></button>
    </div>
    <div class="topics">
      <div class="lbl">Topics covered</div>
      <div class="chips">${chips}</div>
    </div>
  `;
  body.querySelectorAll('.lenbtn').forEach(btn=>{
    btn.addEventListener('click', ()=> startQuiz(parseInt(btn.dataset.len,10)));
  });
  document.getElementById('profileBtn').addEventListener('click', renderProfile);
  document.getElementById('switchBtn').addEventListener('click', renderNameGate);
}

function renderProfile(){
  const profile = loadProfile();
  if(!profile){ renderNameGate(); return; }

  const rank = currentRank(profile);
  const upcoming = nextBadge(profile);
  const accuracy = profile.totalAnswered ? Math.round((profile.totalCorrect/profile.totalAnswered)*100) : 0;

  const badgeCells = BADGES.map(b=>{
    const unlocked = profile.totalAnswered >= b.threshold;
    return `<div class="badgecell">
      ${badgeHex(b, !unlocked)}
      <span class="bname${unlocked?'':' dim'}">${b.name}</span>
      <span class="bprog">${unlocked ? 'unlocked' : Math.min(profile.totalAnswered,b.threshold)+'/'+b.threshold}</span>
    </div>`;
  }).join('');

  const lens = [10,25,50,100];
  const bestRows = lens.map(len=>{
    const best = profile.bestByLength[len];
    return `<div class="bestrow">
      <span class="blen">${len}-question run</span>
      <span class="bscore${best===undefined?' none':''}">${best===undefined ? 'not played' : best.score+'/'+len}</span>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="operatorbar">
      <div class="who">
        <div class="avatar">${initials(profile.nickname)}</div>
        <div>
          <div class="name">${escHtml(profile.nickname)}</div>
          <div class="rank">${rank ? rank.name : 'Unranked'}${upcoming ? ' &middot; next: '+upcoming.name : ''}</div>
        </div>
      </div>
      <button class="linkbtn" id="backBtn">Back</button>
    </div>
    <div class="statgrid">
      <div class="statbox"><div class="sval">${profile.totalAnswered}</div><div class="slbl">answered</div></div>
      <div class="statbox"><div class="sval">${profile.totalCorrect}</div><div class="slbl">correct</div></div>
      <div class="statbox"><div class="sval">${accuracy}%</div><div class="slbl">accuracy</div></div>
    </div>
    <div class="sectionlbl">Rank badges</div>
    <div class="badgegrid">${badgeCells}</div>
    <div class="sectionlbl">Best scores</div>
    <div class="bestgrid">${bestRows}</div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderStart);
}

function startQuiz(n){
  track('quiz_started', { run_length: n });
  state = {
    pool: shuffle(QUESTIONS).slice(0, n),
    idx: 0,
    score: 0,
    answered: false,
    log: []
  };
  renderQuestion();
}

function renderQuestion(){
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);

  body.innerHTML = `
    <div class="progresswrap">
      <div class="progresstrack"><div class="progressfill" style="width:${pct}%"></div></div>
      <div class="progresstxt">${state.idx+1}/${total}</div>
      <div class="scoretxt">Score ${state.score}</div>
    </div>
    <div class="qframe">
      <div class="catpill">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="footerbar">
      <span class="hint">1–4 to answer &middot; enter for next</span>
      <button class="nextbtn" id="nextBtn">Next question</button>
    </div>
  `;

  const optWrap = document.getElementById('options');
  q.options.forEach((optText, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="key">${i+1}</span><span>${optText}</span>`;
    b.addEventListener('click', ()=> selectAnswer(i));
    optWrap.appendChild(b);
  });

  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  state.answered = false;
}

function selectAnswer(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.pool[state.idx];
  const opts = document.querySelectorAll('#options .opt');
  const isRight = i === q.correct;

  opts.forEach((el, idx)=>{
    el.classList.add('locked');
    if(idx === q.correct) el.classList.add('correct');
    if(idx === i && !isRight) el.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if(isRight){
    state.score++;
    fb.className = 'feedback ok';
    fb.textContent = 'Correct.';
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `Not quite — correct answer: ${q.options[q.correct]}`;
  }

  state.log.push({
    cat: q.cat, qtext: q.q,
    chosen: q.options[i], correctText: q.options[q.correct],
    wasRight: isRight
  });

  document.getElementById('nextBtn').classList.add('active');
}

function nextQuestion(){
  if(!state.answered) return;
  if(state.idx < state.pool.length - 1){
    state.idx++;
    renderQuestion();
  } else {
    renderResults();
  }
}

function updateProfileAfterQuiz(total, score){
  const profile = loadProfile();
  if(!profile) return { profile:null, newBadges:[] };

  const before = profile.totalAnswered;
  profile.totalAnswered += total;
  profile.totalCorrect += score;
  const existing = profile.bestByLength[total];
  if(!existing || score > existing.score){
    profile.bestByLength[total] = { score, at: Date.now() };
  }

  const newBadges = BADGES.filter(b => before < b.threshold && profile.totalAnswered >= b.threshold);
  const earnedIds = new Set(profile.badges);
  newBadges.forEach(b => earnedIds.add(b.id));
  profile.badges = Array.from(earnedIds);

  saveProfile(profile);
  return { profile, newBadges };
}

function renderResults(){
  const total = state.pool.length;
  const score = state.score;
  const pct = Math.round((score/total)*100);

  state.finished = true;   // stops Enter on the results screen from re-scoring the run
  const { newBadges } = updateProfileAfterQuiz(total, score);

  track('quiz_completed', { run_length: total, score: score, percent: pct });
  newBadges.forEach(b => track('badge_unlocked', { badge_id: b.id, badge_name: b.name }));

  const unlockHtml = newBadges.length ? newBadges.map(b => {
    const reward = BADGE_REWARDS[b.id];
    return `
    <div class="unlockpanel">
      ${badgeHex(b, false)}
      <div class="utext">
        <div class="utitle">Badge unlocked</div>
        <div class="uname">${b.name} &middot; ${b.desc}</div>
      </div>
      ${reward ? `<a class="ucta" href="${reward.url}" target="_blank" rel="noopener" data-badge="${b.id}">${reward.text}</a>` : ''}
    </div>
  `;
  }).join('') : '';

  const byCat = {};
  state.log.forEach(entry=>{
    if(!byCat[entry.cat]) byCat[entry.cat] = {right:0, total:0};
    byCat[entry.cat].total++;
    if(entry.wasRight) byCat[entry.cat].right++;
  });

  const breakdownHtml = Object.keys(byCat).map(cat=>{
    const {right, total:t} = byCat[cat];
    const p = Math.round((right/t)*100);
    return `<div class="brow">
      <span class="blabel">${cat}</span>
      <span class="btrack"><span class="bfill" style="width:${p}%"></span></span>
      <span class="bval">${right}/${t}</span>
    </div>`;
  }).join('');

  // Weakest category -> tie it to the CTA so the pitch is specific, not generic.
  let weakest = null;
  Object.keys(byCat).forEach(cat=>{
    const {right, total:t} = byCat[cat];
    const acc = right / t;
    if(acc < 1 && (!weakest || acc < weakest.acc)){
      weakest = { cat, acc, right, total:t };
    }
  });

  const ctaHtml = weakest ? `
    <div class="ctacard">
      <div class="ceyebrow">Weak spot</div>
      <div class="ctitle">${weakest.cat} — ${weakest.right}/${weakest.total}</div>
      <div class="csub">${CONFIG.categoryLessonHints[weakest.cat] || 'MOSHELL Pro'} covers this in detail, with hands-on practice instead of multiple choice.</div>
      <a class="cbtn" id="weakCta" href="${CONFIG.bundleUrl}" target="_blank" rel="noopener">See MOSHELL Pro — $37</a>
    </div>
  ` : `
    <div class="ctacard">
      <div class="ceyebrow">Clean sweep</div>
      <div class="ctitle">Perfect score across every topic</div>
      <div class="csub">You are past the basics. MOSHELL Pro goes further with hands-on labs: Docker Compose, iptables, Nginx and server hardening.</div>
      <a class="cbtn" id="weakCta" href="${CONFIG.bundleUrl}" target="_blank" rel="noopener">See MOSHELL Pro — $37</a>
    </div>
  `;

  const missed = state.log.filter(e=>!e.wasRight);
  const missedHtml = missed.length ? `
    <div class="missed">
      <h3>Missed questions (${missed.length})</h3>
      ${missed.map(m=>`
        <div class="mitem">
          <div class="mq">${m.qtext}</div>
          <div class="ma">You answered ${m.chosen} — correct answer: <b>${m.correctText}</b></div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="clean">No misses — clean run.</div>`;

  body.innerHTML = `
    ${unlockHtml}
    <div class="resulttop">
      <div class="ring" style="--pct:${pct}"><span class="val">${pct}%</span></div>
      <div class="rtext">
        <h2>${score} / ${total} correct</h2>
        <p>Across ${Object.keys(byCat).length} topic${Object.keys(byCat).length===1?'':'s'}</p>
      </div>
    </div>
    <div class="breakdown">${breakdownHtml}</div>
    ${ctaHtml}
    ${missedHtml}
    <div class="actions">
      <button class="abtn primary" id="retryBtn">Run again</button>
      <button class="abtn" id="homeBtn">Change length</button>
    </div>
  `;

  document.querySelectorAll('.ucta').forEach(el=>{
    el.addEventListener('click', ()=> track('quiz_cta_click', { type:'badge_reward', badge_id: el.dataset.badge }));
  });
  const weakCta = document.getElementById('weakCta');
  if(weakCta){
    weakCta.addEventListener('click', ()=> track('quiz_cta_click', {
      type: weakest ? 'weak_category' : 'clean_sweep',
      category: weakest ? weakest.cat : null
    }));
  }

  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(total));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

document.addEventListener('keydown', (e)=>{
  if(!state || state.finished) return;
  if(!document.getElementById('options')) return;
  if(['1','2','3','4'].includes(e.key)){
    const i = parseInt(e.key,10)-1;
    const opts = document.querySelectorAll('#options .opt');
    if(opts[i] && !state.answered) selectAnswer(i);
  }
  if(e.key === 'Enter' && state.answered){
    nextQuestion();
  }
});

renderStart();
</script>
</body>
</html>
